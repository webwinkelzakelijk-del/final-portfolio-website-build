<!doctype html>
<!-- Local test helper (not deployed): renders a page in a true 390px-wide viewport for headless screenshots. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}iframe{border:0;width:390px;display:block}</style></head>
<body><script>
const p = new URLSearchParams(location.search);
const f = document.createElement("iframe");
f.src = p.get("u"); f.style.height = (p.get("h") || 3000) + "px";
document.body.append(f);
</script></body></html>
